name: CI

on:
  push:
    branches: [prod, test]
  pull_request:
    branches: [prod, test]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt bandit pip-audit

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Security scan
        run: bandit -r app/ -q

      - name: Dependency audit
        run: pip-audit

      - name: Build Docker image
        run: docker build --target production -t arcade-api .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: arcade-api
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
