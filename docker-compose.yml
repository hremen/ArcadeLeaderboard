services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: arcade-api
    restart: unless-stopped
    environment:
      - DB_PATH=/data/scores.db
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  app_data:
